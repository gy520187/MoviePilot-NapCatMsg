services:
  moviepilot:
    image: jxxghp/moviepilot-v3:latest
    container_name: moviepilot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 超级管理员用户名，首次登录用
      - SUPERUSER=${MOVIEPILOT_SUPERUSER:-admin}
      # API令牌，建议改成随机长字符串
      - API_TOKEN=${MOVIEPILOT_API_TOKEN:-please-change-me}
      # TMDB API Key（如无则留空，首次登录后在设定中填写）
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # 插件市场：官方市场 + 本仓库（NapCat消息通知插件）
      - PLUGIN_MARKET=${PLUGIN_MARKET:-https://github.com/jxxghp/MoviePilot-Plugins}
    volumes:
      - ./moviepilot/config:/config
      # 媒体目录按需修改为宿主机实际路径
      - ./media:/media
    networks:
      - media

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    ports:
      # WebUI端口：用于扫码登录和OneBot网络配置
      - "6099:6099"
    environment:
      # 机器人QQ号（可选，配置后启动时自动填入）
      - ACCOUNT=${NAPCAT_ACCOUNT:-}
      # NapCat WebUI 登录令牌（进 WebUI 管理页用）；OneBot 鉴权令牌在 WebUI「网络配置」中设置
      - TOKEN=${NAPCAT_WEBUI_TOKEN:-}
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
    volumes:
      # NapCat配置目录（含OneBot网络配置）
      - ./napcat/config:/app/napcat/config
      # QQ登录态目录，持久化后重启无需重新扫码
      - ./napcat/qq:/app/.config/QQ
    networks:
      - media

networks:
  media:
    driver: bridge
